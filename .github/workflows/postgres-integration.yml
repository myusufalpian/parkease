name: PostgreSQL Integration

on:
  pull_request:
  push:

jobs:
  postgres-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - run: ./gradlew postgresIntegrationTest --no-daemon
