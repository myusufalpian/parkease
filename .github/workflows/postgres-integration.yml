name: PostgreSQL Integration

on:
  pull_request:
  push:

jobs:
  postgres-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - run: ./gradlew postgresIntegrationTest --no-daemon
      - name: Upload PostgreSQL integration test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-integration-test-report
          path: |
            build/reports/tests/postgresIntegrationTest
            build/test-results/postgresIntegrationTest
          if-no-files-found: warn
          retention-days: 14
